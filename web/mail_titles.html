<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メールタイトル一覧</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://rebikele.s3.ap-northeast-1.amazonaws.com/kokyaku_kanri/rogo.jpg" />
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-3">メールタイトル一覧</h1>
    <div id="selected-account" class="mb-2"></div>
    <div class="mb-3">
      <select id="account-select" class="form-select d-inline-block w-auto me-2">
        <option value="">すべて</option>
        <option value="1">kjet@rebikele.com</option>
        <option value="2">info@rebikele.com</option>
        <option value="3">kanamori@rebikele.com</option>
      </select>
      <button id="load-btn" class="btn btn-primary me-2">読み込み開始</button>
      <div class="small text-muted">ダブルクリックや連続してクリックするとエラーになります。間隔をあけて押してください。</div>
      <div class="btn-group me-2" role="group" id="folder-buttons">
        <button id="inbox-btn" class="btn btn-outline-primary active">受信ボックス</button>
        <button id="sent-btn" class="btn btn-outline-primary">送信ボックス</button>
      </div>
      <div id="category-buttons" class="category-group" role="group"></div>
    </div>
    <div id="loading" class="spinner mb-3"></div>
    <table id="title-table" class="table table-striped">
      <thead class="table-primary">
        <tr>
          <th data-key="date">受信日時</th>
          <th data-key="from">送信元</th>
          <th data-key="subject">タイトル</th>
          <th data-key="body">本文(冒頭)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="row mb-3">
      <div class="col-12 d-flex justify-content-between align-items-center">
        <button id="prev-btn" class="btn btn-outline-primary btn-sm" onclick="prevPage()">前へ</button>
        <span id="page-info">1 / 1</span>
        <button id="next-btn" class="btn btn-outline-primary btn-sm" onclick="nextPage()">次へ</button>
      </div>
    </div>
    <div id="breadcrumb" class="text-muted small mb-2"></div>
    <div class="d-flex align-items-center mb-3">
      <a href="#" class="btn btn-secondary" onclick="goBack(event)">戻る</a>
      <a href="index.html" class="btn btn-primary mx-auto">ホーム</a>
    </div>
  </div>
  <footer class="text-center mt-4">
    <small style="color: var(--bs-link-color);">©2025 JIMUSURU All rights reserved.</small>
  </footer>
  <script src="mail_titles.js"></script>
  <script src="nav.js"></script>
</body>
</html>
