<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>詳細検索</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://rebikele.s3.ap-northeast-1.amazonaws.com/kokyaku_kanri/rogo.jpg" />
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-3">詳細検索</h1>
    <div id="mode-select" class="mb-3 text-center">
      <button id="btn-customer" class="btn btn-primary btn-lg me-2">問い合わせ検索</button>
      <button id="btn-mail" class="btn btn-outline-primary btn-lg">メール検索</button>
    </div>
    <p class="text-muted small mb-3">
      文字、文章やプルダウンを項目に入れると自動検索します。複数のフィルターでの検索は、AND検索になります。<br />
      上記のボタンで問い合わせ検索とメール検索を切り替え、それぞれのグループで検索できます。
    </p>
    <div id="customer-form" class="d-flex flex-wrap gap-2 mb-3">
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">日付</summary>
        <div class="d-flex align-items-center mt-2">
          <input id="s-date" type="date" class="form-control flex-grow-1 filter-input" />
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="s-date" style="display:none;">×</button>
        </div>
      </details>
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">顧客名</summary>
        <div class="d-flex align-items-center mt-2">
          <input id="s-name" class="form-control flex-grow-1 filter-input" />
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="s-name" style="display:none;">×</button>
        </div>
      </details>
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">電話番号</summary>
        <div class="d-flex align-items-center mt-2">
          <input id="s-phone" class="form-control flex-grow-1 filter-input" />
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="s-phone" style="display:none;">×</button>
        </div>
      </details>
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">メールアドレス</summary>
        <div class="d-flex align-items-center mt-2">
          <input id="s-email" class="form-control flex-grow-1 filter-input" />
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="s-email" style="display:none;">×</button>
        </div>
      </details>
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">タスクの状態</summary>
        <div class="d-flex align-items-center mt-2">
          <select id="s-status" class="form-select flex-grow-1 filter-input">
          <option value="">--</option>
          <option value="未着手">未着手</option>
          <option value="進行中">進行中</option>
          <option value="完了">完了</option>
          </select>
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="s-status" style="display:none;">×</button>
        </div>
      </details>
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">問い合わせ種別</summary>
        <div class="d-flex align-items-center mt-2">
          <select id="s-category" class="form-select flex-grow-1 filter-input">
          <option value="">--</option>
          <option value="電話">電話</option>
          <option value="訪問対応">訪問対応</option>
          <option value="メール問い合わせ">メール問い合わせ</option>
          <option value="顧客WEB入力">顧客WEB入力</option>
          <option value="その他">その他</option>
          </select>
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="s-category" style="display:none;">×</button>
        </div>
      </details>
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">バイク機種名</summary>
        <div class="d-flex align-items-center mt-2">
          <input id="s-details" class="form-control flex-grow-1 filter-input" />
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="s-details" style="display:none;">×</button>
        </div>
      </details>
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">本文（メモ）検索</summary>
        <div class="d-flex align-items-center mt-2">
          <input id="s-text" class="form-control flex-grow-1 filter-input" style="min-width:280px;" />
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="s-text" style="display:none;">×</button>
        </div>
      </details>

    </div>
    <div id="mail-form" class="d-flex flex-wrap gap-2 mb-3" style="display:none;">
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">メール受信日</summary>
        <div class="d-flex align-items-center mt-2">
          <input id="m-date" type="date" class="form-control flex-grow-1 filter-input" />
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="m-date" style="display:none;">×</button>
        </div>
      </details>
      <details open class="static">
        <summary class="btn btn-outline-secondary filter-summary">メール検索</summary>
        <div class="d-flex align-items-center mt-2">
          <input id="m-key" class="form-control flex-grow-1 filter-input" placeholder="送信元・タイトル・本文" style="min-width:300px;" />
          <button type="button" class="btn btn-sm btn-outline-secondary ms-2 clear-filter" data-target="m-key" style="display:none;">×</button>
        </div>
      </details>
      
    </div>
    <div id="breadcrumb" class="text-muted small mb-2"></div>
    <div id="customer-results">
      <div id="loading-customer" class="spinner mb-3"></div>
      <table id="result-table" class="table table-striped">
        <thead>
          <tr>
            <th>顧客名</th>
            <th>問い合わせ種別</th>
            <th>バイク種別</th>
            <th>タスクの状態</th>
            <th>本文</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="row mb-3">
        <div class="col-12 d-flex justify-content-between align-items-center">
          <button id="prev-btn" class="btn btn-outline-primary btn-sm" onclick="prevPage()">前へ</button>
          <span id="page-info">1 / 1</span>
          <button id="next-btn" class="btn btn-outline-primary btn-sm" onclick="nextPage()">次へ</button>
        </div>
      </div>
    </div>
    <div id="mail-results" style="display:none;">
      <div id="loading-mail" class="spinner mb-3"></div>
      <h2 class="h5 mt-4">メール検索結果</h2>
      <table id="mail-result-table" class="table table-striped">
        <thead>
          <tr>
            <th>受信日時</th>
            <th>送信メールアドレス</th>
            <th>タイトル</th>
            <th style="width:40%;">本文</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="row mb-3" id="mail-pagination">
        <div class="col-12 d-flex justify-content-between align-items-center">
          <button id="mail-prev-btn" class="btn btn-outline-primary btn-sm" onclick="mailPrevPage()">前へ</button>
          <span id="mail-page-info">1 / 1</span>
          <button id="mail-next-btn" class="btn btn-outline-primary btn-sm" onclick="mailNextPage()">次へ</button>
        </div>
      </div>
    </div>
    <div class="d-flex align-items-center mb-3">
      <a href="#" class="btn btn-secondary" onclick="goBack(event)">戻る</a>
      <a href="index.html" class="btn btn-primary mx-auto">ホーム</a>
    </div>
    </div>
  <footer class="text-center mt-4">
    <small style="color: var(--bs-link-color);">©2025 JIMUSURU All rights reserved.</small>
  </footer>
  <script src="search.js"></script>
  <script src="nav.js"></script>
</body>
</html>
