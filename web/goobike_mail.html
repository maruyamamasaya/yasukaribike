<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メールアドレスごとのメール一覧</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://rebikele.s3.ap-northeast-1.amazonaws.com/kokyaku_kanri/rogo.jpg" />
</head>
<body class="p-4">
  <div class="container">
    <h1 id="page-title" class="mb-3">メールアドレスごとのメール一覧</h1>
    
    <div id="loading" class="spinner mb-3"></div>
    <div class="mb-3">
      <input id="mail-search" class="form-control" placeholder="送信元やタイトル、本文を検索" />
    </div>
    <div class="mb-3 d-flex gap-2" id="sort-container">
      <button id="sort-desc" class="btn btn-outline-primary btn-sm">受信日時↓</button>
      <button id="sort-asc" class="btn btn-outline-primary btn-sm">受信日時↑</button>
      <button id="bulk-add-btn" class="btn btn-primary btn-sm">一括追加</button>
    </div>
    <div id="date-buttons" class="mb-3"></div>
    <table id="mail-table" class="table table-striped">
      <thead>
        <tr>
          <th id="date-header">受信日時</th>
          <th>送信メールアドレス</th>
          <th>タイトル</th>
          <th style="width:40%;">本文</th>
          <th>ボード追加</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="row mb-3">
      <div class="col-12 d-flex justify-content-between align-items-center">
        <button id="prev-btn" class="btn btn-outline-primary btn-sm" onclick="prevPage()">前へ</button>
        <span id="page-info">1 / 1</span>
        <button id="next-btn" class="btn btn-outline-primary btn-sm" onclick="nextPage()">次へ</button>
      </div>
    </div>
    <div id="breadcrumb" class="text-muted small mb-2"></div>
    <div class="d-flex align-items-center mb-3">
      <a href="#" class="btn btn-secondary" onclick="goBack(event)">戻る</a>
      <a href="index.html" class="btn btn-primary mx-auto">ホーム</a>
    </div>
  </div>
  <footer class="text-center mt-4">
    <small style="color: var(--bs-link-color);">©2025 JIMUSURU All rights reserved.</small>
  </footer>
  <script src="goobike_mail.js"></script>
  <script src="nav.js"></script>
</body>
</html>
