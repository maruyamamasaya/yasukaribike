<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ステータス別一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://rebikele.s3.ap-northeast-1.amazonaws.com/kokyaku_kanri/rogo.jpg" />
</head>
<body class="modern-search status-search">
  <main class="search-main" role="main">
    <section class="search-hero status-hero" aria-labelledby="status-title">
      <div class="status-hero-inner container-xl">
        <div class="hero-text">
          <a class="status-back-link" href="index.html">← ホームに戻る</a>
          <h1 id="status-title">ステータス別一覧</h1>
          <p id="status-subtitle" class="search-subtext"></p>
          <nav id="status-nav" class="status-quick-links" aria-label="ステータス切り替え"></nav>
        </div>
        <div class="search-box-wrapper">
          <div class="search-box-floating" role="search">
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M15.75 14.25L20.5 19"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle
                  cx="11"
                  cy="11"
                  r="6"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
              </svg>
            </span>
            <input
              id="status-keyword"
              class="search-input"
              type="search"
              placeholder="キーワードで絞り込み (名前、連絡先、メモなど)"
              autocomplete="off"
            />
            <div class="search-actions">
              <button id="status-clear" type="button" class="search-clear" aria-label="入力をクリア">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M8 8L16 16M16 8L8 16"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>
          <p class="search-note text-muted">
            選択中のステータスに属する顧客のみ表示します。キーワードはスペース区切りで複数指定できます。
          </p>
        </div>
      </div>
    </section>

    <section class="status-summary container-xl" aria-live="polite">
      <div class="glass-panel">
        <div class="glass-panel-inner status-summary-inner">
          <div>
            <p class="filters-caption text-muted small mb-1">現在のステータス</p>
            <h2 id="status-heading" class="status-heading h4 mb-0">--</h2>
          </div>
          <div id="status-count" class="status-count-badge" aria-live="polite">0件</div>
        </div>
      </div>
      <p id="status-error" class="text-danger small mt-2 mb-0 d-none" role="alert">一覧を取得できませんでした。</p>
    </section>

    <section class="status-results container-xl" aria-live="polite">
      <div id="status-loading" class="status-loading" role="status">読み込み中...</div>
      <div id="status-results" class="results-grid" aria-live="polite"></div>
      <p id="status-empty" class="status-empty text-muted d-none">該当する顧客は見つかりませんでした。</p>
    </section>
  </main>

  <footer class="text-center mt-5 mb-4">
    <small style="color: var(--bs-link-color);">©2025 JIMUSURU All rights reserved.</small>
  </footer>

  <script src="status.js"></script>
</body>
</html>
