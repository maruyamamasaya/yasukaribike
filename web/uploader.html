<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>画像アップロード</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-3">画像アップロード</h1>
    <p>キー: <span id="key-label"></span></p>
    <div id="drop-zone" class="border border-secondary rounded p-4 text-center mb-3" style="cursor:pointer;">
      <p class="mb-0">ここに画像をドラッグ＆ドロップ、またはクリックして選択</p>
      <input type="file" id="file-input" accept="image/*" multiple class="d-none" />
    </div>
    <p id="status-msg" class="text-muted"></p>

    <h2 class="h5">サムネイル</h2>
    <div id="thumbnail" class="row row-cols-2 row-cols-md-5 g-3 mb-4"></div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h2 class="h5 mb-0">画像一覧</h2>
      <div class="d-flex gap-2">
        <button id="csv-btn" class="btn btn-secondary btn-sm">CSVコピー</button>
        <button id="close-tab" class="btn btn-outline-secondary btn-sm">閉じる</button>
      </div>
    </div>
    <p class="text-muted">アップロードした画像の一覧です。</p>
    <div id="gallery" class="row row-cols-2 row-cols-md-5 g-3"></div>
    <p id="empty-msg" class="text-muted">画像がありません</p>
  </div>

  <div id="image-modal" class="position-fixed top-0 start-0 w-100 h-100 d-none">
    <div class="position-relative h-100 w-100 d-flex justify-content-center align-items-center">
      <button id="modal-close" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"></button>
      <img id="modal-img" src="" class="img-fluid rounded" />
    </div>
  </div>

  <script src="/uploader.js"></script>
</body>
</html>
