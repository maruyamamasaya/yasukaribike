<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>顧客WEB入力フォーム（従業員入力用）</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://rebikele.s3.ap-northeast-1.amazonaws.com/kokyaku_kanri/rogo.jpg" />
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-2">顧客WEB入力フォーム（従業員入力用）</h1>
    <p class="text-muted">問い合わせ内容を登録するフォームです。必要事項を入力して保存してください。</p>
    <p class="text-muted">一定時間操作がなかった場合も、自動で一時保存されます。</p>
    <p class="text-muted">※氏名カナとE-mailは必須です。その他は必要に応じて入力してください。</p>

    <div class="card p-3">
      <input id="f-order_id" type="hidden" />
      <input id="f-category" type="hidden" value="顧客WEB入力" />

      <div class="mb-2">① ご氏名: <input id="f-name" class="form-control" /></div>
      <div class="mb-2">① 氏名カナ (必須): <input id="f-kana" class="form-control" required /></div>
      <div class="mb-2">② ご連絡先（TEL）: <input id="f-phone" class="form-control" /></div>
      <div class="mb-2">③ E-mail (必須): <input id="f-email" class="form-control" required /></div>

      <div class="mb-2">④ 免許種別:
        <select id="f-license" class="form-select">
          <option value="免許なし">免許なし</option>
          <option value="原付">原付</option>
          <option value="普通二輪（小型限定）">普通二輪（小型限定）</option>
          <option value="普通二輪（限定なし）">普通二輪（限定なし）</option>
          <option value="大型">大型</option>
          <option value="AT限定">AT限定</option>
        </select>
      </div>

      <h5 class="mt-3">アンケート</h5>
      <div class="mb-2">① 現在所有のバイク車種:
        <select id="q-bike" class="form-select">
          <option value="なし">なし</option>
          <option value="あり">あり</option>
        </select>
        <input id="q-bike-model" class="form-control mt-2" placeholder="車種を入力" style="display:none;" />
      </div>
      <div class="mb-2">② 購入時期予定: <input id="q-date" type="month" class="form-control" /></div>
      <div class="mb-2">③ 購入予算: <input id="q-budget" class="form-control" /></div>
      <div class="mb-2">④ ローン希望確認:
        <select id="q-loan" class="form-select">
          <option value="現金">現金</option>
          <option value="ローン検討">ローン検討</option>
        </select>
      </div>
      <div class="mb-2">⑤ 主な用途:
        <select id="q-use" class="form-select">
          <option value="通勤">通勤</option>
          <option value="通学">通学</option>
          <option value="ツーリング">ツーリング</option>
          <option value="配達">配達</option>
          <option value="その他">その他</option>
        </select>
        <input id="q-use-other" class="form-control mt-2" placeholder="その他を入力" style="display:none;" />
      </div>

      <div class="mb-2">ご要望・ご質問:
        <textarea id="f-request" class="form-control" style="width:400px;"></textarea>
      </div>

      <div>
        <button class="btn btn-primary" onclick="saveCustomer()">送信</button>
        <button class="btn btn-outline-primary" onclick="saveCustomer(true)">一時保存</button>
        <a class="btn btn-outline-info" href="drafts.html">一時保存一覧</a>
        <a class="btn btn-secondary" href="#" onclick="goBack(event)">キャンセル</a>
      </div>
      <div id="save-status" class="mt-2 text-success"></div>
    </div>
  </div>
  <div id="breadcrumb" class="text-muted small mb-2"></div>
  <footer class="text-center mt-4">
    <small style="color: var(--bs-link-color);">©2025 JIMUSURU All rights reserved.</small>
  </footer>
  <script src="add_customer.js"></script>
  <script src="nav.js"></script>
</body>
</html>
