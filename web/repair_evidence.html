<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>修理エビデンス登録画面</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/flatly/bootstrap.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-light">
  <div class="container-sm py-3" id="repair-app">
    <header class="d-flex align-items-center justify-content-between gap-2 mb-3">
      <button type="button" class="btn btn-outline-secondary btn-sm" id="back-btn">戻る</button>
      <h1 class="h4 mb-0 text-center flex-grow-1">修理エビデンス登録</h1>
      <div class="flex-shrink-0" style="width:38px;"></div>
    </header>

    <section class="card hero-card shadow-sm border-0 mb-4">
      <div class="card-body text-center py-4">
        <p class="lead fw-semibold mb-3">修理エビデンスを撮影・登録</p>
        <div class="d-flex flex-column gap-2">
          <button id="camera-launch" class="btn btn-primary btn-lg py-3" type="button">
            <span class="d-block fs-4">📷</span>
            <span class="fw-bold">カメラを起動</span>
            <span class="small text-white-50">その場で撮影して即アップロード</span>
          </button>
          <button id="library-launch" class="btn btn-outline-primary btn-lg py-3" type="button">
            <span class="d-block fs-4">🖼️</span>
            <span class="fw-bold">写真を追加</span>
            <span class="small text-primary">端末のギャラリーから複数選択</span>
          </button>
        </div>
        <p class="text-muted mt-3 small">撮影または写真を選択してアップロード。撮影日ごとに自動整理されます。</p>
      </div>
    </section>

    <section class="mb-4" aria-live="polite" aria-label="アップロード状況">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <h2 class="h5 mb-0">アップロードキュー</h2>
        <span id="queue-counter" class="badge rounded-pill text-bg-secondary">0</span>
      </div>
      <div id="queue-list" class="vstack gap-3"></div>
      <p id="empty-queue" class="text-muted small text-center mb-0">まだアップロードは開始されていません。</p>
    </section>

    <section class="mb-4" aria-label="アップロード済みの写真一覧">
      <div class="d-flex align-items-baseline justify-content-between mb-2">
        <h2 class="h5 mb-0">過去のエビデンス</h2>
        <button id="refresh-history" class="btn btn-outline-secondary btn-sm">最新情報に更新</button>
      </div>
      <div id="history-groups" class="history-groups"></div>
      <button id="load-more" class="btn btn-outline-primary w-100 mt-3 d-none">さらに読み込む</button>
    </section>
  </div>

  <div id="progress-announcer" class="visually-hidden" aria-live="polite"></div>

  <input id="camera-input" type="file" accept="image/*" capture="environment" class="d-none" />
  <input id="file-input" type="file" accept="image/*" multiple class="d-none" />

  <template id="queue-item-template">
    <div class="card border-0 shadow-sm queue-card">
      <div class="card-body p-3">
        <div class="d-flex align-items-center gap-3">
          <div class="queue-thumb rounded overflow-hidden bg-light flex-shrink-0"></div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-center">
              <p class="fw-semibold mb-0 text-truncate queue-file-name"></p>
              <span class="badge text-bg-light queue-status">準備中</span>
            </div>
            <p class="small text-muted mb-2 queue-shot-date"></p>
            <div class="progress" style="height:6px;">
              <div class="progress-bar" role="progressbar" style="width:0%"></div>
            </div>
            <p class="small mb-0 text-danger queue-error d-none"></p>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="history-group-template">
    <section class="history-group">
      <header class="d-flex align-items-baseline justify-content-between mb-2">
        <h3 class="h6 mb-0 history-group-title"></h3>
        <span class="small text-muted history-group-count"></span>
      </header>
      <div class="row g-2 history-grid"></div>
      <button type="button" class="btn btn-outline-secondary btn-sm w-100 history-group-more d-none">もっとみる</button>
    </section>
  </template>

  <template id="history-item-template">
    <div class="col-4 col-sm-3 col-md-2">
      <button class="history-item btn btn-light p-0 w-100" type="button">
        <div class="ratio ratio-1x1 rounded overflow-hidden bg-body-secondary">
          <img class="w-100 h-100 object-fit-cover" loading="lazy" alt="修理エビデンス" />
        </div>
      </button>
    </div>
  </template>

  <div id="photo-modal" class="modal-overlay d-none" role="dialog" aria-modal="true" aria-labelledby="photo-modal-title">
    <div class="modal-content rounded-4 shadow-lg bg-white">
      <button type="button" class="btn-close ms-auto me-2 mt-2" id="photo-modal-close" aria-label="閉じる"></button>
      <div class="modal-body">
        <img id="photo-modal-image" class="img-fluid rounded mb-3" alt="選択したエビデンス画像" />
        <div>
          <h3 id="photo-modal-title" class="h6">メタ情報</h3>
          <dl class="row small mb-3">
            <dt class="col-4">撮影日時</dt>
            <dd class="col-8" id="photo-modal-shot-date"></dd>
            <dt class="col-4">解像度</dt>
            <dd class="col-8" id="photo-modal-dimensions"></dd>
            <dt class="col-4">ファイルサイズ</dt>
            <dd class="col-8" id="photo-modal-size"></dd>
          </dl>
          <div class="border-top pt-3">
            <label for="shot-date-input" class="form-label small">撮影日を編集</label>
            <div class="input-group input-group-sm mb-2">
              <input type="date" id="shot-date-input" class="form-control" />
              <button id="shot-date-save" class="btn btn-primary" type="button">保存</button>
            </div>
            <p class="small text-muted">EXIF が無い場合はアップロード日で補完できます。</p>
          </div>
          <div class="d-grid gap-2 mt-3">
            <button id="photo-delete" class="btn btn-outline-danger" type="button">削除する</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js" integrity="sha384-KrOocIA+lZcNUz2MDavnT/FuX+CbTREJihUi0bp8QUSwhE2AkGTNpv2b7yMbBkx5" crossorigin="anonymous"></script>
  <script src="/nav.js"></script>
  <script src="/repair_evidence.js"></script>
</body>
</html>
